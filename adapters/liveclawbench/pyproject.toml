[project]
name = "harbor-liveclawbench-adapter"
version = "0.1.0"
description = "Import the native Harbor tasks from LiveClawBench"
readme = "README.md"
requires-python = ">=3.12"

[project.scripts]
liveclawbench = "liveclawbench_adapter.main:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "liveclawbench_adapter"
