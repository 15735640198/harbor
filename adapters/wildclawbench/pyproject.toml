[project]
name = "harbor-wildclawbench-adapter"
version = "0.1.0"
description = "Harbor adapter for WildClawBench"
readme = "README.md"
authors = []
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.2",
]

[project.scripts]
wildclawbench = "wildclawbench_adapter.main:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "wildclawbench_adapter"
