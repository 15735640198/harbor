[project]
name = "harbor-adapter-pinchbench"
version = "1.0.0"
description = "PinchBench adapter for Harbor framework"
authors = [{ name = "PinchBench Community", email = "community@example.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "markdown-it-py>=3.0.0",
    "pyyaml>=6.0.1",
    "openai>=1.0.0",
]

[project.scripts]
pinchbench-adapter = "run_adapter:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
