jobs_dir: jobs
n_attempts: 1
timeout_multiplier: 1.0
agent_timeout_multiplier: 3.0
orchestrator:
  type: local
  n_concurrent_trials: 1
  quiet: false
environment:
  type: docker
  force_build: true
  delete: true
verifier:
  env:
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
    MODEL_NAME: glm-5.1
agents:
  - name: openclaw
    model_name: anthropic/kimi-k2.6
    kwargs:
      version: "2026.5.27"
      openclaw_config:
        models:
          providers:
            anthropic:
              models:
                - id: kimi-k2.6
                  name: kimi-k2.6
                  contextWindow: 200000
                  maxTokens: 8192
    env:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL}
datasets:
  - path: datasets/pinchbench
