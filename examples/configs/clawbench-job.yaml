jobs_dir: jobs
n_attempts: 10
timeout_multiplier: 1.0
agent_timeout_multiplier: 5.0
orchestrator:
  type: local
  n_concurrent_trials: 1
  quiet: false
environment:
  type: docker
  force_build: true
  delete: true
verifier:
  env:
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
    MODEL_NAME: ${MODEL_NAME:-glm-5.1}
    JUDGE_API_FORMAT: ${JUDGE_API_FORMAT:-auto}
agents:
  - name: openclaw
    model_name: anthropic/kimi-k2.6
    kwargs:
      version: "2026.5.27"
      context_window: 200000
      max_tokens: 8192
    env:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
datasets:
  - path: datasets/clawbench
