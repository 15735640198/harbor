# Run the full imported LiveClawBench dataset.
#
# Prerequisites: generate datasets/liveclawbench, then build every upstream
# per-task base image:
#   cd related-projects/external-tasks/liveclawbench/mock-platform
#   bun run build:images
# See adapters/liveclawbench/README.md for the shared-base image setup.
#
# Run from the repository root:
#   uv run harbor run -c examples/configs/liveclawbench-job.yaml
jobs_dir: jobs
n_attempts: 1
timeout_multiplier: 1.0
agent_timeout_multiplier: 3.0

orchestrator:
  type: local
  n_concurrent_trials: 1
  quiet: false

environment:
  type: docker
  # Reuse successfully built task images. Build all upstream base images once
  # with `bun run build:images` before the first full run.
  force_build: false
  delete: true

# LiveClawBench has 21 tasks whose verifier calls an OpenAI-compatible judge.
# This gateway serves both the Anthropic agent API and the judge's OpenAI API.
verifier:
  env:
    JUDGE_BASE_URL: ${ANTHROPIC_BASE_URL}
    JUDGE_API_KEY: ${ANTHROPIC_API_KEY}
    JUDGE_MODEL_ID: ${JUDGE_MODEL_ID:-glm-5.1}

# Match the OpenClaw model/provider setup used by the PinchBench,
# WildClawBench, and ClawBench examples. Harbor installs this newer OpenClaw
# CLI because it supports the `openclaw agent --model` flag. ANTHROPIC_BASE_URL
# may point to an Anthropic-compatible gateway serving Kimi K2.7 Code.
agents:
  - name: openclaw
    model_name: anthropic/kimi-k2.7-code
    kwargs:
      version: "2026.5.27"
      context_window: 200000
      max_tokens: 8192
      thinking: "off"
      # The gateway accepts the bare provider model ID, while the OpenClaw CLI
      # requires the provider-qualified value in `model_name` above.
      openclaw_config:
        # Keep browser navigation narrowly enabled for task-local mock apps.
        # `web_fetch` intentionally remains blocked for private URLs; Harbor
        # adds task guidance to use curl or the browser for them.
        browser:
          ssrfPolicy:
            dangerouslyAllowPrivateNetwork: false
            allowedHostnames:
              - localhost
              - 127.0.0.1
        models:
          providers:
            anthropic:
              models:
                - id: kimi-k2.7-code
                  name: kimi-k2.7-code
    env:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL}

datasets:
  - path: datasets/liveclawbench
