version = "1.0"

[task]
name = "pinchbench/task-browser-automation"
description = ""

[metadata]
difficulty = "medium"
category = "coding"
tags = ["pinchbench"]

[verifier]
timeout_sec = 600.0
grading_type = "llm_judge"

[verifier.env]
OPENAI_API_KEY = "${{OPENAI_API_KEY}}"
OPENAI_BASE_URL = "${{OPENAI_BASE_URL}}"
LLM_JUDGE_MODEL = "gpt-5-mini"

[agent]
timeout_sec = 300

[environment]
build_timeout_sec = 300.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
